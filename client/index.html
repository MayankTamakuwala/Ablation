<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ablation</title>
    <meta
      name="description"
      content="A log for machine learning experiments: what you changed, what it scored, and whether you could get the number back."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews. The image lives in client/public, so Vite copies it to
         the root of the build and it is served from the site itself at /og.png.
         Scrapers do not resolve relative paths, so these are absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ablation" />
    <meta property="og:url" content="https://ablation-nerf.vercel.app/" />
    <meta property="og:title" content="Ablation" />
    <meta
      property="og:description"
      content="A log for machine learning experiments: what you changed, what it scored, and whether you could get the number back."
    />
    <meta property="og:image" content="https://ablation-nerf.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Ablation, a log for machine learning experiments, with planned, running, concluded and abandoned status chips."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ablation" />
    <meta
      name="twitter:description"
      content="A log for machine learning experiments: what you changed, what it scored, and whether you could get the number back."
    />
    <meta name="twitter:image" content="https://ablation-nerf.vercel.app/og.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
